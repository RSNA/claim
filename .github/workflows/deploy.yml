name: Publish site to rsna.github.io/claim

# Builds the Jekyll site in docs/ and copies the result into the claim/ folder
# of the RSNA/rsna.github.io repository, which serves https://rsna.github.io/claim/
#
# Requires the secret RSNA_GITHUB_IO_DEPLOY_KEY: the private half of an SSH
# deploy key whose public half is added (with write access) to RSNA/rsna.github.io.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "publish-site"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build with Jekyll
        working-directory: docs
        run: bundle exec jekyll build --baseurl "/claim"
        env:
          JEKYLL_ENV: production

      - name: Check out rsna.github.io
        uses: actions/checkout@v4
        with:
          repository: RSNA/rsna.github.io
          ssh-key: ${{ secrets.RSNA_GITHUB_IO_DEPLOY_KEY }}
          path: rsna.github.io

      - name: Copy site into claim/
        run: rsync -a --delete docs/_site/ rsna.github.io/claim/

      - name: Commit and push
        working-directory: rsna.github.io
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A claim
          if git diff --cached --quiet; then
            echo "Site unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "Update CLAIM site from RSNA/CLAIM@${GITHUB_SHA::7}"
          git push
